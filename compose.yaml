services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    container_name: prometheus
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - ./prometheus/.env
    # keep 400 days of metrics so monthly/quarterly reports have data;
    # the size cap deletes the oldest data first if disk use passes 20GB
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=400d
      - --storage.tsdb.retention.size=20GB
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/config:/etc/prometheus
      - ./prometheus/data:/prometheus
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    container_name: grafana
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - ./grafana/.env
    ports:
      - '3000:3000'
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus

  unpoller:
    image: ghcr.io/unpoller/unpoller:latest
    restart: unless-stopped
    container_name: unpoller
    env_file:
      - ./unpoller/.env
    ports:
      - '9130:9130'

  # log store for UniFi security events pushed by unpoller (config: loki/config/loki.yml)
  # no ports are published: Loki has no authentication and only grafana and unpoller need it
  loki:
    image: grafana/loki:3.7.8 # pinned: loki/config/loki.yml is written for Loki 3.x
    restart: unless-stopped
    container_name: loki
    user: "${UID:-1000}:${GID:-1000}"
    command: -config.file=/etc/loki/loki.yml
    env_file:
      - ./loki/.env
    volumes:
      - ./loki/config:/etc/loki
      - ./loki/data:/loki

  # weekly/monthly/quarterly PDF reports from prometheus + loki (see reporter/report.py)
  # run one by hand: docker compose exec reporter python report.py run weekly --no-email
  reporter:
    build: ./reporter
    restart: unless-stopped
    container_name: reporter
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - ./reporter/.env
    volumes:
      - ./reporter/out:/out
    depends_on:
      - prometheus
      - loki

# optional log viewer for docker containers
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ./dozzle/.env
    ports:
      - '8080:8080'
